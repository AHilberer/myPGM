name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    name: pytest (${{ matrix.python-version }}, ${{ matrix.deps }} deps)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # oldest and newest supported Python, with the latest dependencies
          - python-version: "3.10"
            deps: latest
          - python-version: "3.13"
            deps: latest
          # the lower bounds declared in pyproject.toml, to check they really work
          - python-version: "3.10"
            deps: oldest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install oldest supported dependencies
        if: matrix.deps == 'oldest'
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==1.24.0" "scipy==1.10.0" "PyQt5==5.15.0" "pyqtgraph==0.13.3"

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Installed versions
        run: python -m pip list | grep -i -E "^(numpy|scipy|pyqt5|pyqtgraph) "

      - name: Run tests
        run: python -m pytest -rx
